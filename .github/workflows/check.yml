name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:lint
      - name: Component catalog is up to date
        run: |
          npm run catalog
          git diff --exit-code -- packages/ui/catalog packages/ui/src/components
      - run: npm run build
      # GitHub's ubuntu runners ship Google Chrome at /usr/bin/google-chrome, which the Playwright config uses.
      - run: npm test
