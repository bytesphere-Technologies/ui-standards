<!doctype html>
<html lang="en" data-theme="light" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ByteSphere UI standard</title>
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <script>
      try {
        var q = new URLSearchParams(location.search), s = JSON.parse(localStorage.getItem("ui.appearance") || "{}"), r = document.documentElement;
        var mode = q.get("theme") || s.mode || "system";
        var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        r.dataset.theme = dark ? "dark" : "light"; r.dataset.dark = q.get("dark") || s.dark || "midnight"; r.dataset.light = q.get("light") || s.light || "paper";
        r.dataset.radius = q.get("radius") || s.radius || "standard"; r.dataset.density = q.get("density") || s.density || "comfortable"; r.dataset.accent = q.get("accent") || s.accent || "azure"; r.dataset.nav = q.get("nav") || s.nav || "surface";
      } catch (e) {}
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
